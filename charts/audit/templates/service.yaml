apiVersion: v1
kind: Service
metadata:
  name: {{ include "audit.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "audit.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "audit.selectorLabels" . | nindent 4 }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
      protocol: TCP
