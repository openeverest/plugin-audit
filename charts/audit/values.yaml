replicaCount: 1

image:
  repository: ghcr.io/openeverest/plugin-audit
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

service:
  port: 8080

# Authentication for the event stream connection.
# Until the host implements spec 003 §10.4 (projected plugin service tokens),
# the plugin authenticates via POST /v1/session using credentials from a Secret.
# Create a Secret with keys "username" and "password", then reference its name here.
auth:
  credentialsSecretName: ""

plugin:
  displayName: "Audit Log"
  description: "Captures OpenEverest lifecycle events and exposes them as a searchable audit log."
  vendor: "OpenEverest"
  enabled: true
  bundlePath: "/main.js"
  extensionPoints:
    - type: route
      path: /audit
      label: Audit Log
    - type: sidebarItem
      path: /audit
      label: Audit Log
      icon: "/icon.png"

  # Event types the daemon subscribes to (spec 003 §10.5).
  # Empty list = all event types.
  eventTypes:
    - database-cluster.created
    - database-cluster.ready
    - database-cluster.updated
    - database-cluster.deleted
    - database-cluster.failed
    - backup.started
    - backup.completed
    - backup.failed
    - restore.started
    - restore.completed
    - restore.failed
    - instance.created
    - instance.deleted
    - user.login
    - user.login-failed
    - user.logout
    - plugin.installed
    - plugin.uninstalled
    - plugin.enabled
    - plugin.disabled
    - namespace.added
    - namespace.removed
    - settings.updated

  # Optional namespace filter for the event subscription. Leave empty to
  # consume from every namespace the plugin's permissions allow.
  namespaces: []

# Storage configuration. MVP only supports the embedded SQLite driver; Phase 2
# will add a PostgreSQL backend selectable via storage.driver.
storage:
  driver: sqlite
  sqlite:
    # Mount path of the persistent volume holding audit.db.
    path: /data/audit.db
  persistence:
    enabled: true
    size: 5Gi
    # storageClass: ""
    accessMode: ReadWriteOnce

# Optional override for the Everest API URL. When left empty the backend
# auto-discovers the everest Service via Kubernetes-injected env vars.
everestAPIURL: ""

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 64Mi
