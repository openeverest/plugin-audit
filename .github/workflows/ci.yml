name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-bundle
          path: backend/dist/main.js
          retention-days: 1

  backend:
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.22'
          cache-dependency-path: backend/go.sum
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: frontend-bundle
          path: backend/dist
      - name: Ensure embed targets exist
        run: |
          mkdir -p backend/dist
          [ -f backend/dist/main.js ] || touch backend/dist/main.js
          [ -f backend/dist/icon.png ] || cp src/icon.png backend/dist/icon.png || touch backend/dist/icon.png
      - working-directory: backend
        run: |
          go vet ./...
          go test ./...
          CGO_ENABLED=0 go build -o /tmp/audit-server .

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.14.4
      - run: helm lint charts/audit
      - run: helm template test charts/audit > /tmp/rendered.yaml
      - run: cat /tmp/rendered.yaml | head -200
